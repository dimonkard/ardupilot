name: Build ArduPilot for FK723M1-ZGT6

on:
  push:
    branches:
      - main
      - master
      - "fk723m1/**"

  pull_request:

  workflow_dispatch:


jobs:
  build:
    name: Build FK723M1-ZGT6
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Europe/Paris
      SKIP_AP_GIT_CHECK: 1

    steps:

      # ============================================================
      # 1. Checkout ArduPilot
      # ============================================================

      - name: Checkout ArduPilot
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0


      # ============================================================
      # 2. Configure Git
      # ============================================================

      - name: Configure Git
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"


      # ============================================================
      # 3. Install ArduPilot dependencies
      # ============================================================

      - name: Install ArduPilot dependencies
        run: |
          Tools/environment_install/install-prereqs-ubuntu.sh -qy


      # ============================================================
      # 4. Configure ARM toolchain
      # ============================================================

      - name: Configure ARM toolchain
        run: |
          TOOLCHAIN="/opt/gcc-arm-none-eabi-10-2020-q4-major/bin"

          if [ ! -d "$TOOLCHAIN" ]; then
            echo "ERROR: ARM toolchain directory does not exist:"
            echo "$TOOLCHAIN"
            exit 1
          fi

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          export PATH="$TOOLCHAIN:$PATH"

          echo "========================================"
          echo "ARM GCC"
          echo "========================================"

          which arm-none-eabi-gcc
          arm-none-eabi-gcc --version

          echo
          echo "========================================"
          echo "ARM G++"
          echo "========================================"

          which arm-none-eabi-g++
          arm-none-eabi-g++ --version


      # ============================================================
      # 5. Configure Python environment
      # ============================================================

      - name: Configure Python environment
        run: |
          if [ -f "$HOME/venv-ardupilot/bin/activate" ]; then
            source "$HOME/venv-ardupilot/bin/activate"
          fi

          echo "Python:"
          python3 --version

          echo
          echo "Python executable:"
          python3 -c "import sys; print(sys.executable)"


      # ============================================================
      # 6. Check board files
      # ============================================================

      - name: Check FK723M1 hwdef
        run: |
          echo "========================================"
          echo "Checking board files"
          echo "========================================"

          test -f \
            libraries/AP_HAL_ChibiOS/hwdef/FK723M1-ZGT6/hwdef.dat

          test -f \
            libraries/AP_HAL_ChibiOS/hwdef/FK723M1-ZGT6/hwdef-bl.dat

          echo
          echo "========================================"
          echo "hwdef.dat"
          echo "========================================"

          cat \
            libraries/AP_HAL_ChibiOS/hwdef/FK723M1-ZGT6/hwdef.dat

          echo
          echo "========================================"
          echo "hwdef-bl.dat"
          echo "========================================"

          cat \
            libraries/AP_HAL_ChibiOS/hwdef/FK723M1-ZGT6/hwdef-bl.dat


      # ============================================================
      # 7. Check Board ID
      # ============================================================

      - name: Check board ID
        run: |
          echo "========================================"
          echo "Searching for board ID"
          echo "========================================"

          grep -n "AP_HW_FK723M1_ZGT6" \
            Tools/AP_Bootloader/board_types.txt


      # ============================================================
      # 8. Check that Waf sees the board
      # ============================================================

      - name: Check board
        run: |
          echo "========================================"
          echo "Searching for FK723M1-ZGT6"
          echo "========================================"

          ./waf list_boards | grep -F "FK723M1-ZGT6"


      # ============================================================
      # 9. Build bootloader
      # ============================================================

      - name: Build bootloader
        run: |
          echo "========================================"
          echo "Building bootloader"
          echo "========================================"

          python3 Tools/scripts/build_bootloaders.py FK723M1-ZGT6

          echo
          echo "========================================"
          echo "Searching for generated bootloader"
          echo "========================================"

          find . \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.elf" \
              -o -name "*.hex" \
            \) \
            | grep -i \
              "FK723M1\|bootloader" \
            || true


      # ============================================================
      # 10. Check bootloader
      # ============================================================

      - name: Check bootloader
        run: |
          echo "========================================"
          echo "Tools/bootloaders"
          echo "========================================"

          ls -lah Tools/bootloaders || true

          echo
          echo "========================================"
          echo "FK723M1 bootloader files"
          echo "========================================"

          find Tools/bootloaders \
            -type f \
            -iname "*FK723M1*" \
            -print \
            || true

          echo
          echo "========================================"
          echo "All bootloader binary files"
          echo "========================================"

          find Tools/bootloaders \
            -type f \
            -name "*.bin" \
            -print \
            || true


      # ============================================================
      # 11. Configure ArduPilot
      # ============================================================

      - name: Configure ArduPilot
        run: |
          echo "========================================"
          echo "Configuring ArduPilot"
          echo "========================================"

          ./waf configure \
            --board FK723M1-ZGT6


      # ============================================================
      # 12. Build ArduCopter
      # ============================================================
      - name: Debug clock configuration
        run: |
          echo "========================================"
          echo "Generated hwdef.h"
          echo "========================================"

          grep -n \
            -E "OSCILLATOR|HSECLK|HSE|CLOCK" \
            build/FK723M1-ZGT6/hwdef.h \
            || true

          echo
          echo "========================================"
          echo "Search STM32_HSECLK definitions"
          echo "========================================"

          grep -R \
            -n \
            "STM32_HSECLK" \
            build/FK723M1-ZGT6 \
            libraries/AP_HAL_ChibiOS/hwdef/common \
            | head -100 \
            || true

          echo
          echo "========================================"
          echo "hwdef.dat"
          echo "========================================"

          cat \
            libraries/AP_HAL_ChibiOS/hwdef/FK723M1-ZGT6/hwdef.dat

      - name: Check generated feature defines
        run: |
          echo "========================================"
          echo "Generated feature defines"
          echo "========================================"

          grep -n -E \
            "OSD_ENABLED|HAL_MSP_ENABLED|HAL_LOGGING_ENABLED|HAL_GYROFFT_ENABLED|MODE_TURTLE_ENABLED|AP_GPS_BACKEND_DEFAULT_ENABLED|HAL_MOUNT_ENABLED|AP_SCRIPTING_ENABLED" \
            build/FK723M1-ZGT6/hwdef.h \
            || true

          echo
          echo "========================================"
          echo "Source hwdef"
          echo "========================================"

          grep -n -E \
            "minimize_features|HAL_LOGGING_ENABLED" \
            libraries/AP_HAL_ChibiOS/hwdef/FK723M1-ZGT6/hwdef.dat \
            || true
            
      - name: Build ArduCopter
        run: |
          echo "========================================"
          echo "Building ArduCopter"
          echo "========================================"

          ./waf copter


      # ============================================================
      # 13. Show firmware files
      # ============================================================

      - name: Show firmware files
        if: always()
        run: |
          echo "========================================"
          echo "Firmware files"
          echo "========================================"

          if [ -d "build/FK723M1-ZGT6/bin" ]; then
            find build/FK723M1-ZGT6/bin \
              -maxdepth 1 \
              -type f \
              -print
          else
            echo "Firmware directory does not exist"
          fi

          echo
          echo "========================================"
          echo "Bootloader files"
          echo "========================================"

          find Tools/bootloaders \
            -maxdepth 1 \
            -type f \
            -iname "*FK723M1*" \
            -print \
            || true


      # ============================================================
      # 14. Prepare artifacts
      # ============================================================

      - name: Prepare artifacts
        if: always()
        run: |
          echo "========================================"
          echo "Preparing artifacts"
          echo "========================================"

          mkdir -p artifacts/firmware
          mkdir -p artifacts/bootloader

          # --------------------------------------------------------
          # Firmware
          # --------------------------------------------------------

          if [ -d "build/FK723M1-ZGT6/bin" ]; then

            find build/FK723M1-ZGT6/bin \
              -maxdepth 1 \
              -type f \
              -exec cp -v {} artifacts/firmware/ \;

          else

            echo "No firmware directory found"

          fi


          # --------------------------------------------------------
          # Bootloader
          # --------------------------------------------------------

          find Tools/bootloaders \
            -maxdepth 1 \
            -type f \
            -iname "*FK723M1*" \
            -exec cp -v {} artifacts/bootloader/ \; \
            || true


          # --------------------------------------------------------
          # Copy hwdef files
          # --------------------------------------------------------

          cp -v \
            libraries/AP_HAL_ChibiOS/hwdef/FK723M1-ZGT6/hwdef.dat \
            artifacts/

          cp -v \
            libraries/AP_HAL_ChibiOS/hwdef/FK723M1-ZGT6/hwdef-bl.dat \
            artifacts/


          echo
          echo "========================================"
          echo "Final artifacts"
          echo "========================================"

          find artifacts \
            -type f \
            -print


      # ============================================================
      # 15. Upload firmware
      # ============================================================

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FK723M1-ZGT6-firmware
          path: artifacts/firmware/
          if-no-files-found: warn


      # ============================================================
      # 16. Upload bootloader
      # ============================================================

      - name: Upload bootloader
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FK723M1-ZGT6-bootloader
          path: artifacts/bootloader/
          if-no-files-found: warn


      # ============================================================
      # 17. Upload hwdef files
      # ============================================================

      - name: Upload hwdef
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FK723M1-ZGT6-hwdef
          path: |
            artifacts/hwdef.dat
            artifacts/hwdef-bl.dat
          if-no-files-found: warn
